name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vibescore-ci .
      - name: Smoke-test the production image
        run: |
          docker run -d --name vs -p 8787:8787 vibescore-ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/api/status && exit 0
            sleep 1
          done
          docker logs vs
          exit 1
